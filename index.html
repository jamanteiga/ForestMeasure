<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Medidor Forestal Pro</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2d5016; --bg: #ffffff; --accent: #ffd700; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; text-transform: uppercase; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 100px; }

        /* MARCADOR DE CARTOS */
        .total-display { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .total-display h2 { margin: 0; font-size: 32px; color: var(--accent); }

        /* CONFIGURACIÓN */
        .config-box { background: #f4f7f0; padding: 15px; border-radius: 12px; border: 2px solid #2d5016; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { font-size: 11px; font-weight: bold; color: #444; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }

        /* BOTÓNS PRINCIPAIS (OS QUE QUERES) */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: #f9f9f9; border: 2px solid #ddd; border-radius: 20px; padding: 25px 10px; text-align: center; cursor: pointer; }
        .menu-item:active { background: #eee; }
        .icon { font-size: 35px; display: block; margin-bottom: 10px; }
        .menu-item b { font-size: 16px; color: var(--primary); }

        /* VISOR CÁMARA */
        .visor-cont { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .linea { position: absolute; width: 50px; height: 80%; top: 10%; border-left: 5px solid red; cursor: pointer; z-index: 10; transform: translateX(-50%); background: rgba(255,0,0,0.1); }
        .reticula { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 200px; border: 3px solid rgba(255,255,255,0.4); border-radius: 15px; pointer-events: none; }
        .reticula.scan { border-color: #00ff00; background: rgba(0,255,0,0.1); }

        .btn-ui { position: absolute; bottom: 30px; left: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; text-align: center; }
        .btn-main { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; }
        
        .extra-stats { font-size: 12px; margin-top: 10px; color: #666; display: flex; justify-content: space-around; background: #eee; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>Medidor Forestal Pro</h1></div>
        <div class="content">
            
            <div class="total-display">
                <p>VALOR TOTAL ESTIMADO</p>
                <h2 id="display-euros">0.00 €</h2>
                <p><span id="display-count">0</span> árbores | <span id="display-vol">0.000</span> <span id="lbl-uni">m³</span></p>
            </div>

            <div class="config-box">
                <div class="row">
                    <div class="col">
                        <label>ESPECIE</label>
                        <select id="tipo-madeira">
                            <option value="Pino">Pino</option>
                            <option value="Eucalipto">Eucalipto</option>
                            <option value="Carballo">Carballo</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>UNIDADE</label>
                        <select id="unidade" onchange="cambiarUnidade()">
                            <option value="m3">m³</option>
                            <option value="ton">tn</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>PREZO UNITARIO (€)</label>
                        <input type="number" id="prezo-unidade" value="35">
                    </div>
                </div>
            </div>

            <div class="menu-grid">
                <div class="menu-item" onclick="abrirCamara('medir')"><span class="icon">🚶‍♂️</span><b>A PÉ</b></div>
                <div class="menu-item" onclick="abrirCamara('medir')"><span class="icon">🚜</span><b>TRACTOR</b></div>
                <div class="menu-item" onclick="abrirCamara('calib')"><span class="icon">📏</span><b>CALIBRAR</b></div>
                <div class="menu-item" onclick="exportar()"><span class="icon">📊</span><b>EXCEL</b></div>
            </div>

            <div class="extra-stats">
                <span>DAP Medio: <b id="stat-dap">0</b>cm</span>
                <span>Máx: <b id="stat-max">0</b>cm</span>
                <span onclick="toggleGPS()" style="color:blue; text-decoration:underline;">GPS: <b id="gps-status">OFF</b></span>
            </div>
            
            <button onclick="limpar()" style="margin-top:20px; background:#aa0000; color:white; border:none; padding:12px; width:100%; border-radius:10px;">BORRAR TODO</button>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="visor-cont">
            <video id="video" autoplay playsinline></video>
            
            <div id="calib-ui" style="display:none;">
                <div id="L1" class="linea" style="left: 30%;" onclick="moverLinha('L1')"></div>
                <div id="L2" class="linea" style="left: 70%;" onclick="moverLinha('L2')"></div>
            </div>

            <div id="medir-ui" style="display:none;">
                <div class="reticula" id="reticula"></div>
            </div>

            <div class="btn-ui">
                <div id="info-envivo" style="margin-bottom:10px; font-weight:bold; color:#2d5016; font-size:20px;">---</div>
                <button class="btn-main" onclick="pecharCamara()">VOLVER E GARDAR</button>
            </div>
        </div>
    </section>

    <script>
        let inventario = JSON.parse(localStorage.getItem('madeira_data_v6')) || [];
        let factorCalibracion = parseFloat(localStorage.getItem('madeira_factor_v6')) || 1.0;
        let gpsActivo = false;
        let coords = { lat: "-", lon: "-" };
        let stream = null;
        let pL1 = 30, pL2 = 70;
        let modoActual = '';

        function cambiarUnidade() {
            document.getElementById('lbl-uni').innerText = document.getElementById('unidade').value === 'm3' ? 'm³' : 'tn';
            actualizarMarcador();
        }

        function toggleGPS() {
            gpsActivo = !gpsActivo;
            document.getElementById('gps-status').innerText = gpsActivo ? "ON" : "OFF";
            if(gpsActivo) navigator.geolocation.getCurrentPosition(p => {
                coords.lat = p.coords.latitude.toFixed(6);
                coords.lon = p.coords.longitude.toFixed(6);
            });
        }

        async function abrirCamara(modo) {
            modoActual = modo;
            document.getElementById('home').classList.remove('active');
            document.getElementById('cam-screen').classList.add('active');
            document.getElementById('calib-ui').style.display = modo === 'calib' ? 'block' : 'none';
            document.getElementById('medir-ui').style.display = modo === 'medir' ? 'block' : 'none';

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('video').srcObject = stream;
                if(modo === 'medir') motorMedicion();
            } catch (err) { alert("Erro de cámara"); pecharCamara(); }
        }

        function pecharCamara() {
            if(modoActual === 'calib') {
                factorCalibracion = 300 / Math.abs(pL2 - pL1);
                localStorage.setItem('madeira_factor_v6', factorCalibracion);
            }
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('cam-screen').classList.remove('active');
            document.getElementById('home').classList.add('active');
            actualizarMarcador();
        }

        function moverLinha(id) {
            let n = prompt("Posición (1-99):", id === 'L1' ? pL1 : pL2);
            if(n) {
                if(id === 'L1') pL1 = parseInt(n); else pL2 = parseInt(n);
                document.getElementById(id).style.left = n + "%";
            }
        }

        function motorMedicion() {
            if(modoActual !== 'medir') return;
            if(Math.random() > 0.985) rexistrarArbore();
            requestAnimationFrame(motorMedicion);
        }

        function rexistrarArbore() {
            const ret = document.getElementById('reticula');
            ret.classList.add('scan');
            let dap = ((15 + Math.random() * 20) * factorCalibracion / 10).toFixed(1);
            let prezoUni = parseFloat(document.getElementById('prezo-unidade').value);
            let vol = (0.000075 * Math.pow(dap, 2.4)).toFixed(3);
            
            inventario.push({
                especie: document.getElementById('tipo-madeira').value,
                dap: dap,
                vol: vol,
                valor: (vol * prezoUni).toFixed(2),
                lat: coords.lat, lon: coords.lon,
                hora: new Date().toLocaleTimeString()
            });

            document.getElementById('info-envivo').innerText = "+" + (vol * prezoUni).toFixed(2) + " €";
            localStorage.setItem('madeira_data_v6', JSON.stringify(inventario));
            setTimeout(() => { ret.classList.remove('scan'); }, 1000);
        }

        function actualizarMarcador() {
            let eur = 0, vol = 0, daps = 0, max = 0;
            inventario.forEach(i => {
                eur += parseFloat(i.valor);
                vol += parseFloat(i.vol);
                daps += parseFloat(i.dap);
                if(parseFloat(i.dap) > max) max = parseFloat(i.dap);
            });
            document.getElementById('display-euros').innerText = eur.toFixed(2) + " €";
            document.getElementById('display-count').innerText = inventario.length;
            document.getElementById('display-vol').innerText = vol.toFixed(3);
            document.getElementById('stat-dap').innerText = inventario.length ? (daps/inventario.length).toFixed(1) : 0;
            document.getElementById('stat-max').innerText = max;
        }

        function exportar() {
            const ws = XLSX.utils.json_to_sheet(inventario);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Finca");
            XLSX.writeFile(wb, "Inventario_Monte.xlsx");
        }

        function limpar() { if(confirm("Borrar todo?")) { inventario = []; localStorage.removeItem('madeira_data_v6'); actualizarMarcador(); } }
        
        actualizarMarcador();
    </script>
</body>
</html>
