<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TreeMeasure PRO - Calibración 300mm</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2d5016; --accent: #7cb342; --bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 20px; text-align: center; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--bg); }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }

        /* MENU PRINCIPAL */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .menu-item { background: #f9f9f9; border: 2px solid #eee; border-radius: 20px; padding: 25px 10px; text-align: center; }
        .icon { font-size: 35px; display: block; margin-bottom: 10px; }

        /* CALIBRADOR VISUAL */
        .calib-container { width: 100%; height: 300px; background: #000; position: relative; border-radius: 15px; overflow: hidden; }
        .calib-line { position: absolute; width: 2px; height: 100px; background: red; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        #line1 { left: 20%; }
        #line2 { left: 80%; }
        .calib-label { position: absolute; top: 10px; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.5); font-size: 12px; }

        /* BOTONES */
        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-secondary { background: #eee; color: #333; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        .guide-walk { width: 60px; height: 60px; border: 2px solid gold; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>🌳 TreeMeasure PRO</h1></div>
        <div class="content">
            <div class="menu-grid">
                <div class="menu-item" onclick="abrirCamara('walk')"><span class="icon">🚶‍♂️</span><b>A PIE</b></div>
                <div class="menu-item" onclick="abrirCamara('tractor')"><span class="icon">🚜</span><b>TRACTOR</b></div>
                <div class="menu-item" onclick="abrirCalibracion()"><span class="icon">📏</span><b>CALIBRAR</b></div>
                <div class="menu-item" onclick="showScreen('map-screen')"><span class="icon">🗺️</span><b>MAPA</b></div>
            </div>
            <button class="btn btn-main" style="background:#1D6F42; margin-top:30px;" onclick="exportarExcel()">📊 EXPORTAR EXCEL</button>
        </div>
    </section>

    <section id="calib" class="screen">
        <div class="header"><h1>Calibración 300mm</h1></div>
        <div class="content">
            <p style="font-size: 14px;">Coloca una <b>regla de 300mm</b> a la distancia de trabajo y ajusta las líneas rojas a sus extremos:</p>
            
            <div class="calib-container">
                <video id="v-calib" autoplay playsinline></video>
                <div class="calib-label">AJUSTA LAS LÍNEAS A LOS 300mm DE TU REGLA</div>
                <div id="line1" class="calib-line"></div>
                <div id="line2" class="calib-line"></div>
            </div>

            <div style="margin-top:20px; text-align:center;">
                <label>Ancho en píxeles: <b id="px-val">---</b></label><br>
                <small>Referencia: 300.0 mm</small>
            </div>

            <button class="btn btn-main" onclick="guardarCalibracion()">CONFIRMAR CALIBRACIÓN</button>
            <button class="btn btn-secondary" onclick="cerrarCalib()">CANCELAR</button>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="content" style="padding:0; position:relative;">
            <video id="v" autoplay playsinline></video>
            <div class="guide-walk"></div>
            <div style="position:absolute; bottom:20px; width:100%; padding:20px; box-sizing:border-box;">
                <div style="background:white; padding:15px; border-radius:15px; text-align:center; margin-bottom:10px;">
                    <span style="font-size:30px; font-weight:bold; color:var(--primary)" id="live-dap">0.0 cm</span>
                </div>
                <button class="btn btn-main" onclick="capturar()">📸 REGISTRAR ÁRBOL</button>
                <button class="btn btn-secondary" onclick="cerrarCamara()">VOLVER</button>
            </div>
        </div>
    </section>

    <script>
        let inventario = JSON.parse(localStorage.getItem('f_data')) || [];
        let factorPxMm = localStorage.getItem('f_calib') || 1.0; 
        let stream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- LÓGICA DE CALIBRACIÓN POR REGLA ---
        let line1Pos = 20;
        let line2Pos = 80;

        async function abrirCalibracion() {
            showScreen('calib');
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById('v-calib').srcObject = stream;
            actualizarCalculoCalib();
        }

        // Hacer las líneas arrastrables (Simplificado para móvil)
        document.getElementById('line1').onclick = () => { line1Pos = prompt("Posición línea 1 (0-100):", line1Pos); actualizarCalculoCalib(); };
        document.getElementById('line2').onclick = () => { line2Pos = prompt("Posición línea 2 (0-100):", line2Pos); actualizarCalculoCalib(); };

        function actualizarCalculoCalib() {
            document.getElementById('line1').style.left = line1Pos + "%";
            document.getElementById('line2').style.left = line2Pos + "%";
            let diffPx = Math.abs(line2Pos - line1Pos);
            document.getElementById('px-val').innerText = diffPx.toFixed(1) + "% del visor";
        }

        function guardarCalibracion() {
            // Calculamos cuántos % de pantalla equivalen a 300mm
            let diffPercent = Math.abs(line2Pos - line1Pos);
            factorPxMm = 300 / diffPercent; 
            localStorage.setItem('f_calib', factorPxMm);
            alert("Calibración guardada respecto a 300mm");
            cerrarCalib();
        }

        function cerrarCalib() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            showScreen('home');
        }

        // --- MEDICIÓN ---
        async function abrirCamara() {
            showScreen('cam-screen');
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById('v').srcObject = stream;
        }

        function capturar() {
            // El DAP se calcula usando el factor guardado (ejemplo simplificado)
            let dapSimulado = (60 * factorPxMm / 10).toFixed(1); 
            let vol = (0.00008 * Math.pow(dapSimulado, 2.45)).toFixed(3);
            
            inventario.push({
                id: inventario.length + 1,
                dap: dapSimulado,
                vol: vol,
                fecha: new Date().toLocaleString()
            });
            document.getElementById('live-dap').innerText = dapSimulado + " cm";
            localStorage.setItem('f_data', JSON.stringify(inventario));
        }

        function cerrarCamara() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            showScreen('home');
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(inventario);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Finca");
            XLSX.writeFile(wb, "Inventario_Forestal.xlsx");
        }
    </script>
</body>
</html>
