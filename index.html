<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Medidor árboles</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2d5016; --bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--bg); }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }

        /* MENU PRINCIPAL */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .menu-item { background: #f9f9f9; border: 2px solid #eee; border-radius: 20px; padding: 25px 10px; text-align: center; }
        .icon { font-size: 35px; display: block; margin-bottom: 10px; }

        /* VISOR AHORRO BATERÍA */
        .visor-container { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .area-escaneo { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 160px; border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
        }
        .area-escaneo.lock { border: 4px solid #00ff00; background: rgba(0, 255, 0, 0.05); }

        .live-panel {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 15px;
            text-align: center;
        }

        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        .btn-verde { background: var(--primary); color: white; margin-top: 10px; }
        .btn-excel { background: #1D6F42; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>Medidor árboles</h1></div>
        <div class="content">
            <div style="background:#f1f8e9; padding:15px; border-radius:15px; margin-bottom:20px; text-align:center; border:1px solid #ddd;">
                <small style="color:#666;">REGISTROS EN MEMORIA</small><br>
                <b style="font-size:28px; color:var(--primary);" id="main-count">0</b>
            </div>

            <div class="menu-grid">
                <div class="menu-item" onclick="iniciarEscaneo()"><span class="icon">🚶‍♂️</span><b>A PIE</b></div>
                <div class="menu-item" onclick="iniciarEscaneo()"><span class="icon">🚜</span><b>TRACTOR</b></div>
                <div class="menu-item" onclick="showScreen('calib')"><span class="icon">📏</span><b>CALIBRAR</b></div>
                <div class="menu-item" onclick="showScreen('map-screen')"><span class="icon">🗺️</span><b>MAPA</b></div>
            </div>

            <button class="btn btn-excel" onclick="exportarExcel()">📊 EXPORTAR EXCEL (.XLSX)</button>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="visor-container">
            <video id="v" autoplay playsinline></video>
            <div class="area-escaneo" id="target"></div>
            
            <div class="live-panel">
                <div style="font-size:28px; font-weight:bold; color:var(--primary);">
                    DAP: <span id="live-dap">---</span> cm
                </div>
                <div id="status-text" style="font-size:12px; color:#666; margin-bottom:10px;">Escaneando automáticamente...</div>
                <button class="btn btn-verde" onclick="pararEscaneo()">FINALIZAR</button>
            </div>
        </div>
    </section>

    <script>
        let inventario = JSON.parse(localStorage.getItem('f_inventario')) || [];
        let factorCalib = localStorage.getItem('f_calib_val') || 1.0;
        let stream = null;
        let modoAuto = false;
        let cooldown = false;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('main-count').innerText = inventario.length;
        }

        async function iniciarEscaneo() {
            showScreen('cam-screen');
            modoAuto = true;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', frameRate: { ideal: 15 } } 
                });
                document.getElementById('v').srcObject = stream;
                ejecutarIA();
            } catch (err) {
                alert("Error al acceder a la cámara");
                pararEscaneo();
            }
        }

        function ejecutarIA() {
            if (!modoAuto) return;

            // Simulación de detección optimizada
            if (Math.random() > 0.985 && !cooldown) {
                registrarAutomatico();
            }
            requestAnimationFrame(ejecutarIA);
        }

        function registrarAutomatico() {
            cooldown = true;
            const target = document.getElementById('target');
            target.classList.add('lock');

            let dap = (20 + Math.random() * 15).toFixed(1);
            let vol = (0.00008 * Math.pow(dap, 2.45)).toFixed(3);
            
            inventario.push({
                id: inventario.length + 1,
                dap: dap,
                vol: vol,
                fecha: new Date().toLocaleTimeString()
            });

            document.getElementById('live-dap').innerText = dap;
            localStorage.setItem('f_inventario', JSON.stringify(inventario));

            // Bloqueo de 3s para evitar duplicados y ahorrar procesado
            setTimeout(() => {
                target.classList.remove('lock');
                cooldown = false;
            }, 3000);
        }

        function pararEscaneo() {
            modoAuto = false;
            if(stream) stream.getTracks().forEach(t => t.stop());
            showScreen('home');
        }

        function exportarExcel() {
            if(inventario.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(inventario);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Mediciones");
            XLSX.writeFile(wb, "Inventario.xlsx");
        }

        document.getElementById('main-count').innerText = inventario.length;
    </script>
</body>
</html>
