<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Medidor árbores</title>
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #2d5016; --bg: #ffffff; --accent: #ffd700; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 40px; }

        /* MARCADOR */
        .total-display { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .total-display h2 { margin: 0; font-size: 32px; color: var(--accent); }

        /* CUADRÍCULA DE 6 BOTÓNS */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-item { background: #f9f9f9; border: 2px solid #ddd; border-radius: 15px; padding: 20px 5px; text-align: center; cursor: pointer; }
        .icon { font-size: 30px; display: block; margin-bottom: 5px; }
        .menu-item b { font-size: 12px; color: var(--primary); text-transform: uppercase; }

        /* CALIBRACIÓN E CÁMARA */
        .visor-cont { flex: 1; position: relative; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Liña de calibración */
        #cal-line { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: 4px; background: #007bff; border: 2px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 5; display: none;
        }

        .cam-ui { position: absolute; bottom: 20px; left: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; text-align: center; z-index: 10; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th, .data-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #map { flex: 1; width: 100%; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>Medidor árbores</h1></div>
        <div class="content">
            <div class="total-display">
                <h2 id="display-euros">0.00 €</h2>
                <p><span id="display-count">0</span> árbores | <span id="display-vol">0.000</span> t/m³</p>
            </div>

            <div class="menu-grid">
                <div class="menu-item" onclick="abrirCalibracion()"><span class="icon">⚙️</span><b>Calibración</b></div>
                <div class="menu-item" onclick="abrirCamara()"><span class="icon">📸</span><b>Medir</b></div>
                <div class="menu-item" onclick="irA('map-screen')"><span class="icon">📍</span><b>Mapa</b></div>
                <div class="menu-item" onclick="irA('prezos-screen')"><span class="icon">💰</span><b>Prezos</b></div>
                <div class="menu-item" onclick="irA('datos-screen')"><span class="icon">📂</span><b>Arquivos</b></div>
                <div class="menu-item" onclick="exportarExcel()"><span class="icon">📊</span><b>Excel</b></div>
            </div>
        </div>
    </section>

    <section id="cal-screen" class="screen">
        <div class="visor-cont">
            <video id="video-cal" autoplay playsinline></video>
            <div id="cal-line"></div>
            <div class="cam-ui">
                <p style="margin:0 0 10px 0; font-size:12px;">Axusta a liña aos <b>30cm</b> da regra</p>
                <input type="range" id="range-cal" min="50" max="400" value="200" style="width:100%;" oninput="axustarLiña(this.value)">
                <button onclick="gardarCalibracion()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; margin-top:10px;">GARDAR CALIBRACIÓN</button>
            </div>
        </div>
    </section>

    <section id="prezos-screen" class="screen">
        <div class="header"><h1>Prezos Abegondo</h1></div>
        <div class="content">
            <div style="display:flex; gap:5px; margin-bottom:15px;">
                <button onclick="setModo('pie')" id="btn-pie" style="flex:1; padding:10px;">EN PÉ</button>
                <button onclick="setModo('carg')" id="btn-carg" style="flex:1; padding:10px;">CARGADEIRO</button>
            </div>
            <table id="tabla-prezos" style="width:100%;"></table>
            <button onclick="irA('home')" style="width:100%; padding:15px; margin-top:20px; background:var(--primary); color:white; border:none; border-radius:10px;">VOLVER</button>
        </div>
    </section>

    <section id="datos-screen" class="screen">
        <div class="header"><h1>Editar Árbores</h1></div>
        <div class="content">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Esp.</th><th>DAP</th><th>Acción</th></tr></thead>
                <tbody id="lista-datos"></tbody>
            </table>
            <button onclick="irA('home')" style="width:100%; padding:15px; margin-top:20px; background:var(--primary); color:white; border:none; border-radius:10px;">VOLVER</button>
        </div>
    </section>

    <section id="map-screen" class="screen">
        <div id="map"></div>
        <button onclick="irA('home')" style="position:absolute; bottom:20px; left:20px; right:20px; z-index:1000; padding:15px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold;">VOLVER</button>
    </section>

    <section id="cam-screen" class="screen">
        <div class="visor-cont">
            <video id="video-medir" autoplay playsinline></video>
            <div class="cam-ui">
                <select id="sel-especie" style="width:100%; padding:10px; margin-bottom:10px;"></select>
                <div id="live-dap" style="font-size:24px; font-weight:bold; color:var(--primary);">--- cm</div>
                <button onclick="capturarArbore()" style="width:100%; padding:15px; background:#d9534f; color:white; border:none; border-radius:10px; font-weight:bold;">CAPTURAR</button>
                <button onclick="pecharCamara()" style="margin-top:10px; background:none; border:none; color:#666;">Cancelar</button>
            </div>
        </div>
    </section>

    <script>
        const especiesBase = [
            { id: 0, nome: 'Euc. Globulus', pe: 33.5, carg: 48 },
            { id: 1, nome: 'Euc. Nitens', pe: 29, carg: 45 },
            { id: 2, nome: 'Pino Sierra', pe: 20, carg: 36.5 },
            { id: 3, nome: 'Pino Puntal', pe: 22.5, carg: 28 },
            { id: 4, nome: 'Carballo', pe: 47.5, carg: 66.5 },
            { id: 5, nome: 'Castaño', pe: 85, carg: 100 },
            { id: 6, nome: 'Ribeira', pe: 19.5, carg: 21 }
        ];

        let inventario = JSON.parse(localStorage.getItem('medidor_data')) || [];
        let prezos = JSON.parse(localStorage.getItem('medidor_prezos')) || especiesBase;
        let pxPorCm = parseFloat(localStorage.getItem('calibracion_px')) || 10; 
        let modoActual = 'pie';
        let map, markerGroup, stream;

        function irA(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'map-screen') setTimeout(initMap, 200);
            if(id === 'datos-screen') renderDatos();
            if(id === 'prezos-screen') renderPrezos();
        }

        // --- CALIBRACIÓN ---
        async function abrirCalibracion() {
            irA('cal-screen');
            document.getElementById('cal-line').style.display = 'block';
            stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
            document.getElementById('video-cal').srcObject = stream;
        }

        function axustarLiña(val) {
            document.getElementById('cal-line').style.width = val + 'px';
        }

        function gardarCalibracion() {
            const larguraPx = parseInt(document.getElementById('range-cal').value);
            pxPorCm = larguraPx / 30; // 30cm é a regra
            localStorage.setItem('calibracion_px', pxPorCm);
            alert("Calibrado: " + pxPorCm.toFixed(2) + " px/cm");
            pecharCamara();
        }

        // --- MEDIR ---
        async function abrirCamara() {
            irA('cam-screen');
            const sel = document.getElementById('sel-especie');
            sel.innerHTML = prezos.map((e,i) => `<option value="${i}">${e.nome}</option>`).join('');
            stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
            document.getElementById('video-medir').srcObject = stream;
            
            // Simulación de detección basada na calibración
            window.camInt = setInterval(() => {
                // Aquí simúlase que o sensor detecta un obxecto que ocupa 250px na pantalla
                const simPx = 200 + (Math.random() * 50); 
                window.curDap = (simPx / pxPorCm).toFixed(1);
                document.getElementById('live-dap').innerText = window.curDap + " cm";
            }, 1000);
        }

        function pecharCamara() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            clearInterval(window.camInt);
            document.getElementById('cal-line').style.display = 'none';
            irA('home');
        }

        // --- RESTO DE FUNCIÓNS (IGUAIS) ---
        function renderPrezos() {
            const body = document.getElementById('tabla-prezos');
            body.innerHTML = '';
            prezos.forEach((e, i) => {
                const val = (modoActual === 'pie') ? e.pe : e.carg;
                body.innerHTML += `<tr><td><b>${e.nome}</b></td><td align="right"><input type="number" value="${val}" style="width:60px;" onchange="updateP(${i}, this.value)"> €</td></tr>`;
            });
        }

        function updateP(i, v) {
            if(modoActual === 'pie') prezos[i].pe = parseFloat(v); else prezos[i].carg = parseFloat(v);
            localStorage.setItem('medidor_prezos', JSON.stringify(prezos));
            actualizarTotais();
        }

        function setModo(m) { modoActual = m; renderPrezos(); }

        function renderDatos() {
            const body = document.getElementById('lista-datos');
            body.innerHTML = '';
            inventario.forEach((a, i) => {
                body.innerHTML += `<tr><td>${i+1}</td><td>${prezos[a.ei].nome}</td><td>${a.d}cm</td><td><button onclick="borrarArbore(${i})">🗑️</button></td></tr>`;
            });
        }

        function borrarArbore(i) {
            if(confirm("Eliminar?")) {
                inventario.splice(i, 1);
                localStorage.setItem('medidor_data', JSON.stringify(inventario));
                renderDatos(); actualizarTotais();
            }
        }

        function actualizarTotais() {
            let eur = 0, vol = 0;
            inventario.forEach(a => {
                const e = prezos[a.ei];
                eur += a.v * ((modoActual === 'pie') ? e.pe : e.carg);
                vol += a.v;
            });
            document.getElementById('display-euros').innerText = eur.toFixed(2) + " €";
            document.getElementById('display-count').innerText = inventario.length;
            document.getElementById('display-vol').innerText = vol.toFixed(3);
        }

        function capturarArbore() {
            navigator.geolocation.getCurrentPosition(p => {
                const ei = document.getElementById('sel-especie').value;
                const d = parseFloat(window.curDap);
                const v = parseFloat((0.00008 * Math.pow(d, 2.4)).toFixed(3));
                inventario.push({ ei, d, v, la: p.coords.latitude, lo: p.coords.longitude });
                localStorage.setItem('medidor_data', JSON.stringify(inventario));
                actualizarTotais();
                alert("Capturada!");
            });
        }

        function initMap() {
            if(!map) {
                map = L.map('map').setView([43.2, -8.3], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                markerGroup = L.layerGroup().addTo(map);
            }
            markerGroup.clearLayers();
            inventario.forEach(a => L.marker([a.la, a.lo]).addTo(markerGroup));
            map.invalidateSize();
        }

        function exportarExcel() {
            const d = inventario.map(a => ({ Especie: prezos[a.ei].nome, DAP: a.d, Vol: a.v }));
            const ws = XLSX.utils.json_to_sheet(d);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventario");
            XLSX.writeFile(wb, "Inventario.xlsx");
        }

        actualizarTotais();
    </script>
</body>
</html>
