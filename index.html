<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Medidor Forestal Pro</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2d5016; --bg: #ffffff; --accent: #ffd700; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }

        /* CONFIGURACIÓN INICIAL */
        .config-box { background: #f4f7f0; padding: 15px; border-radius: 12px; border: 2px solid #2d5016; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { font-size: 11px; font-weight: bold; color: #444; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background: white; }

        /* MARCADOR DE CARTOS INCREMENTAL */
        .total-display { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .total-display h2 { margin: 0; font-size: 32px; color: var(--accent); }
        .total-display p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        /* BOTÓNS MENÚ */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #eee; border-radius: 15px; padding: 20px 10px; text-align: center; font-weight: bold; cursor: pointer; border: 1px solid #ddd; }
        .card:active { background: #ccc; }
        .icon { font-size: 28px; display: block; margin-bottom: 10px; }

        /* VISOR CÁMARA E CALIBRACIÓN */
        .visor-cont { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Liñas de calibración máis grosas e fáciles de tocar */
        .linea { position: absolute; width: 50px; height: 80%; top: 10%; border-left: 5px solid red; cursor: pointer; z-index: 10; transform: translateX(-50%); background: rgba(255,0,0,0.1); }
        .linea::after { content: "↔"; position: absolute; top: 50%; left: -15px; color: white; background: red; border-radius: 50%; width: 25px; height: 25px; text-align: center; }

        .reticula { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 200px; border: 3px solid rgba(255,255,255,0.4); border-radius: 15px; pointer-events: none; }
        .reticula.scan { border-color: #00ff00; background: rgba(0,255,0,0.1); box-shadow: 0 0 20px #00ff00; }

        .btn-ui { position: absolute; bottom: 30px; left: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; text-align: center; }
        .btn-main { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>Medidor Forestal Pro</h1></div>
        <div class="content">
            
            <div class="total-display">
                <p>VALOR TOTAL ESTIMADO</p>
                <h2 id="display-euros">0.00 €</h2>
                <p><span id="display-count">0</span> árbores | <span id="display-vol">0.000</span> <span id="lbl-uni">m³</span></p>
            </div>

            <div class="config-box">
                <div class="row">
                    <div class="col">
                        <label>ESPECIE</label>
                        <select id="tipo-madeira">
                            <option value="Pino">Pino</option>
                            <option value="Eucalipto">Eucalipto</option>
                            <option value="Carballo">Carballo</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>UNIDADE</label>
                        <select id="unidade" onchange="cambiarUnidade()">
                            <option value="m3">Metros Cúbicos (m³)</option>
                            <option value="ton">Toneladas (tn)</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>PREZO POR UNIDADE (€)</label>
                        <input type="number" id="prezo-unidade" value="35" step="0.5">
                    </div>
                </div>
            </div>

            <div class="grid">
                <div class="card" onclick="abrirCamara('medir')"><span class="icon">🌲</span>ESCANEAR MONTE</div>
                <div class="card" onclick="abrirCamara('calib')"><span class="icon">📏</span>CALIBRAR (300mm)</div>
            </div>
            
            <button onclick="exportar()" style="margin-top:20px; background:#1d6f42; color:white; border:none; padding:15px; width:100%; border-radius:10px; font-weight:bold;">📊 DESCARGAR EXCEL</button>
            <button onclick="limpar()" style="margin-top:10px; background:#aa0000; color:white; border:none; padding:10px; width:100%; border-radius:10px; font-size:12px;">BORRAR TODO</button>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="visor-cont">
            <video id="video" autoplay playsinline></video>
            
            <div id="calib-ui" style="display:none;">
                <div id="L1" class="linea" style="left: 30%;" onclick="moverLinha('L1')"></div>
                <div id="L2" class="linea" style="left: 70%;" onclick="moverLinha('L2')"></div>
            </div>

            <div id="medir-ui" style="display:none;">
                <div class="reticula" id="reticula"></div>
            </div>

            <div class="btn-ui">
                <div id="info-envivo" style="margin-bottom:10px; font-weight:bold; color:#2d5016; font-size:20px;">---</div>
                <button class="btn-main" onclick="pecharCamara()">VOLVER E GARDAR</button>
            </div>
        </div>
    </section>

    <script>
        let inventario = JSON.parse(localStorage.getItem('madeira_data')) || [];
        let factorCalibracion = parseFloat(localStorage.getItem('madeira_factor')) || 1.0;
        let stream = null;
        let pL1 = 30, pL2 = 70;
        let modoActual = '';

        function cambiarUnidade() {
            document.getElementById('lbl-uni').innerText = document.getElementById('unidade').value === 'm3' ? 'm³' : 'tn';
            actualizarMarcador();
        }

        async function abrirCamara(modo) {
            modoActual = modo;
            document.getElementById('home').classList.remove('active');
            document.getElementById('cam-screen').classList.add('active');
            
            document.getElementById('calib-ui').style.display = modo === 'calib' ? 'block' : 'none';
            document.getElementById('medir-ui').style.display = modo === 'medir' ? 'block' : 'none';

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 } }, 
                    audio: false 
                });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                if(modo === 'medir') motorMedicion();
            } catch (err) {
                alert("ERRO: Non se puido acceder á cámara. Revisa os permisos do navegador.");
                pecharCamara();
            }
        }

        function pecharCamara() {
            if(modoActual === 'calib') {
                let pixels = Math.abs(pL2 - pL1);
                factorCalibracion = 300 / pixels; // 300mm dividido entre o ancho en %
                localStorage.setItem('madeira_factor', factorCalibracion);
                alert("Calibración gardada.");
            }
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('cam-screen').classList.remove('active');
            document.getElementById('home').classList.add('active');
            actualizarMarcador();
        }

        function moverLinha(id) {
            let n = prompt("Posición da liña (1-99):", id === 'L1' ? pL1 : pL2);
            if(n && !isNaN(n)) {
                if(id === 'L1') pL1 = parseInt(n);
                else pL2 = parseInt(n);
                document.getElementById(id).style.left = n + "%";
            }
        }

        function motorMedicion() {
            if(modoActual !== 'medir') return;
            
            // Simulación de detección: En un caso real aquí iría o procesado de imaxe
            // Para que o usuario vexa como o prezo sobe ao detectar árbores:
            if(Math.random() > 0.98) { 
                rexistrarArbore();
            }
            requestAnimationFrame(motorMedicion);
        }

        function rexistrarArbore() {
            const ret = document.getElementById('reticula');
            ret.classList.add('scan');
            
            // Lóxica de cálculo
            let diametroSimulado = (15 + Math.random() * 20) * factorCalibracion / 10; // cm
            let prezoUni = parseFloat(document.getElementById('prezo-unidade').value);
            let tipo = document.getElementById('tipo-madeira').value;
            let uni = document.getElementById('unidade').value;
            
            // Cálculo de volume aproximado (m3)
            let vol = (0.00007 * Math.pow(diametroSimulado, 2.5)).toFixed(3);
            let valor = (vol * prezoUni).toFixed(2);

            inventario.push({
                especie: tipo,
                dap: diametroSimulado.toFixed(1),
                vol: vol,
                prezo: valor,
                unidade: uni,
                hora: new Date().toLocaleTimeString()
            });

            document.getElementById('info-envivo').innerText = "+" + valor + " € (" + diametroSimulado.toFixed(1) + "cm)";
            localStorage.setItem('madeira_data', JSON.stringify(inventario));

            setTimeout(() => { 
                ret.classList.remove('scan'); 
                document.getElementById('info-envivo').innerText = "Buscando...";
            }, 1000);
        }

        function actualizarMarcador() {
            let totalEur = 0;
            let totalVol = 0;
            inventario.forEach(item => {
                totalEur += parseFloat(item.prezo);
                totalVol += parseFloat(item.vol);
            });
            document.getElementById('display-euros').innerText = totalEur.toFixed(2) + " €";
            document.getElementById('display-count').innerText = inventario.length;
            document.getElementById('display-vol').innerText = totalVol.toFixed(3);
        }

        function exportar() {
            if(inventario.length === 0) return alert("Non hai datos para exportar.");
            const ws = XLSX.utils.json_to_sheet(inventario);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Medicións");
            XLSX.writeFile(wb, "Inventario_Monte.xlsx");
        }

        function limpar() {
            if(confirm("Seguro que queres borrar todos os datos acumulados?")) {
                inventario = [];
                localStorage.removeItem('madeira_data');
                actualizarMarcador();
            }
        }

        actualizarMarcador();
    </script>
</body>
</html>
