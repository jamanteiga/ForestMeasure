<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Medidor Forestal</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="iniciarOpenCV()"></script>
    <style>
        :root { --primary: #2d5016; --bg: #ffffff; --accent: #ffd700; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 100px; }

        .total-display { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .total-display h2 { margin: 0; font-size: 32px; color: var(--accent); }

        .config-box { background: #f4f7f0; padding: 15px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { font-size: 11px; font-weight: bold; color: #444; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background: white; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: #f9f9f9; border: 2px solid #ddd; border-radius: 20px; padding: 20px 10px; text-align: center; cursor: pointer; }
        .icon { font-size: 30px; display: block; margin-bottom: 5px; }
        .menu-item b { font-size: 14px; color: var(--primary); }

        /* Visor Cámara e OpenCV */
        .visor-cont { flex: 1; position: relative; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0.7; }
        
        .linea { position: absolute; width: 60px; height: 80%; top: 10%; border-left: 4px solid red; cursor: pointer; z-index: 10; transform: translateX(-50%); }
        .area-scan { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 160px; height: 200px; border: 2px dashed #00ff00; z-index: 10; }

        .btn-ui { position: absolute; bottom: 30px; left: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; text-align: center; z-index: 20; }
        .btn-main { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; font-size: 16px; }

        /* Lista de Rexistros (Pausa/Edición) */
        .lista-rexistros { margin-top: 20px; }
        .item-rexistro { background: #f1f1f1; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-borrar { background: #aa0000; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        #status-cv { font-size: 12px; color: orange; font-weight: bold; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>Medidor Forestal</h1></div>
        <div class="content">
            <div id="status-cv">Cargando Motor de Visión...</div>
            
            <div class="total-display">
                <h2 id="display-euros">0.00 €</h2>
                <p><span id="display-count">0</span> árbores | <span id="display-vol">0.000</span> m³</p>
            </div>

            <div class="config-box">
                <div class="row">
                    <div class="col">
                        <label>ESPECIE</label>
                        <select id="tipo-madeira" onchange="cargarPrezo()">
                            <option value="Pino">Pino</option>
                            <option value="Eucalipto">Eucalipto</option>
                            <option value="Carballo">Carballo</option>
                            <option value="Castiñeiro">Castiñeiro</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>PREZO (€/m³)</label>
                        <input type="number" id="prezo-unidade" value="35" oninput="gardarPrezo()">
                    </div>
                </div>
            </div>

            <div class="menu-grid">
                <div class="menu-item" onclick="abrirCamara('medir')"><span class="icon">📸</span><b>ESCANEAR</b></div>
                <div class="menu-item" onclick="abrirCamara('calib')"><span class="icon">📏</span><b>CALIBRAR</b></div>
                <div class="menu-item" onclick="irA('rexistros')"><span class="icon">📝</span><b>EDITAR / PAUSA</b></div>
                <div class="menu-item" onclick="exportar()"><span class="icon">📊</span><b>EXCEL</b></div>
            </div>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="visor-cont">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas-cv"></canvas>
            
            <div id="calib-ui" style="display:none;">
                <div id="L1" class="linea" style="left: 30%;" onclick="moverLinha('L1')"></div>
                <div id="L2" class="linea" style="left: 70%;" onclick="moverLinha('L2')"></div>
            </div>

            <div id="medir-ui" style="display:none;">
                <div class="area-scan" id="reticula"></div>
            </div>

            <div class="btn-ui">
                <div id="info-envivo" style="margin-bottom:10px; font-weight:bold; color:var(--primary); font-size:24px;">Apuntando...</div>
                <button class="btn-main" onclick="capturarArbore()" id="btn-captura" style="display:none; background:#ff6b6b; margin-bottom:10px;">CAPTURAR AGORA</button>
                <button class="btn-main" onclick="pecharCamara()">VOLVER</button>
            </div>
        </div>
    </section>

    <section id="rexistros-screen" class="screen">
        <div class="header"><h1>Rexistros (Pausa)</h1></div>
        <div class="content">
            <button class="btn-main" style="margin-bottom: 20px;" onclick="irA('home')">VOLVER Á FINCA</button>
            <div class="lista-rexistros" id="lista-datos"></div>
        </div>
    </section>

    <script src="./app.js"></script>
</body>
</html>
