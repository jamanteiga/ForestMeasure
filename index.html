<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Medidor de Árboles - ORIGINAL</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2d5016; --accent: #7cb342; --bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        /* HEADER ORIGINAL VERDE */
        .header { background: var(--primary); color: white; padding: 40px 15px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--bg); }
        .screen.active { display: flex; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }

        /* GRID DE 4 APARTADOS ORIGINALES */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .menu-item { 
            background: #f9f9f9; border: 2px solid #eeeeee; border-radius: 20px; 
            padding: 30px 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .menu-item:active { background: #e8f5e9; transform: scale(0.98); }
        .icon { font-size: 40px; display: block; margin-bottom: 10px; }
        .menu-item b { color: var(--primary); font-size: 16px; }

        /* ESTADÍSTICAS RÁPIDAS */
        .stats-bar { 
            background: #e8f5e9; border-radius: 12px; padding: 15px; 
            margin-bottom: 20px; display: flex; justify-content: space-around; 
            border: 1px solid var(--accent);
        }
        .stat-box { text-align: center; }
        .stat-box small { font-size: 10px; color: #666; display: block; text-transform: uppercase; }
        .stat-box b { font-size: 18px; color: var(--primary); }

        /* CÁMARA Y RETÍCULAS */
        .camera-wrap { width: 100%; height: 400px; background: #000; position: relative; border-radius: 15px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .guide-tractor { width: 200px; height: 200px; border: 3px dashed var(--accent); border-radius: 50%; }
        .guide-walk { width: 50px; height: 50px; border: 2px solid gold; }

        /* BOTONES */
        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        .btn-main { background: var(--primary); color: white; margin-top: 15px; }
        .btn-excel { background: #1D6F42; color: white; margin-top: 20px; }
        .btn-secondary { background: #eee; color: #333; margin-top: 10px; }

        #map { flex: 1; width: 100%; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>🌳 TreeMeasure</h1></div>
        <div class="content">
            <div class="stats-bar">
                <div class="stat-box"><small>Árboles</small><b id="count-ui">0</b></div>
                <div class="stat-box"><small>Total m³</small><b id="vol-ui">0.0</b></div>
                <div class="stat-box"><small>Valor Est.</small><b id="money-ui">0 €</b></div>
            </div>

            <div class="menu-grid">
                <div class="menu-item" onclick="abrirCamara('walk')">
                    <span class="icon">🚶‍♂️</span><b>A PIE</b>
                </div>
                <div class="menu-item" onclick="abrirCamara('tractor')">
                    <span class="icon">🚜</span><b>TRACTOR</b>
                </div>
                <div class="menu-item" onclick="showScreen('calib')">
                    <span class="icon">📏</span><b>CALIBRAR</b>
                </div>
                <div class="menu-item" onclick="showScreen('map-screen')">
                    <span class="icon">🗺️</span><b>MAPA</b>
                </div>
            </div>

            <button class="btn btn-excel" onclick="exportarExcel()">📊 EXPORTAR EXCEL (.XLSX)</button>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="header"><h1 id="cam-title">Medición</h1></div>
        <div class="content" style="padding:10px;">
            <div class="camera-wrap">
                <video id="v" autoplay playsinline></video>
                <div id="reticula" class="guide"></div>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <span style="font-size: 40px; font-weight: bold; color: var(--primary);"><span id="live-dap">0.0</span> cm</span>
            </div>
            <button class="btn btn-main" style="height:80px; font-size:20px;" onclick="capturar()">📸 REGISTRAR ÁRBOL</button>
            <button class="btn btn-secondary" onclick="cerrarCamara()">VOLVER</button>
        </div>
    </section>

    <section id="calib" class="screen">
        <div class="header"><h1>Calibración</h1></div>
        <div class="content">
            <p>Ajusta la escala de la cámara según la distancia al árbol:</p>
            <div style="background:#f0f0f0; padding:20px; border-radius:15px; text-align:center;">
                <label>Factor de Escala:</label><br>
                <input type="range" min="0.5" max="2.0" step="0.1" id="range-calib" style="width:100%; margin:20px 0;">
                <b id="val-calib">1.0</b>
            </div>
            <button class="btn btn-main" onclick="showScreen('home')">GUARDAR Y VOLVER</button>
        </div>
    </section>

    <section id="map-screen" class="screen">
        <div id="map"></div>
        <button class="btn btn-main" onclick="showScreen('home')" style="border-radius:0; margin:0;">CERRAR MAPA</button>
    </section>

    <script>
        let inventario = JSON.parse(localStorage.getItem('f_data')) || [];
        let stream = null;
        let gps = { lat: 0, lng: 0 };
        let precios = { "Madera": 35 };

        // GPS
        navigator.geolocation.watchPosition(p => {
            gps = { lat: p.coords.latitude, lng: p.coords.longitude };
        }, null, { enableHighAccuracy: true });

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            actualizarUI();
            if(id === 'map-screen') setTimeout(initMap, 200);
        }

        async function abrirCamara(modo) {
            showScreen('cam-screen');
            document.getElementById('cam-title').innerText = modo === 'tractor' ? "Modo Tractor" : "Modo a Pie";
            document.getElementById('reticula').className = modo === 'tractor' ? 'guide guide-tractor' : 'guide guide-walk';
            
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById('v').srcObject = stream;
        }

        function cerrarCamara() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            showScreen('home');
        }

        function capturar() {
            const dap = (Math.random() * 10 + 20).toFixed(1);
            const vol = (0.00008 * Math.pow(dap, 2.45)).toFixed(3);
            
            const registro = {
                id: inventario.length + 1,
                dap: parseFloat(dap),
                vol: parseFloat(vol),
                lat: gps.lat,
                lng: gps.lng,
                fecha: new Date().toLocaleString()
            };

            inventario.push(registro);
            localStorage.setItem('f_data', JSON.stringify(inventario));
            document.getElementById('live-dap').innerText = dap;
            
            // Vibración de confirmación
            if(navigator.vibrate) navigator.vibrate(100);
            actualizarUI();
        }

        function actualizarUI() {
            const totalVol = inventario.reduce((s, i) => s + i.vol, 0);
            document.getElementById('count-ui').innerText = inventario.length;
            document.getElementById('vol-ui').innerText = totalVol.toFixed(2);
            document.getElementById('money-ui').innerText = (totalVol * precios.Madera).toFixed(0) + " €";
        }

        function exportarExcel() {
            if(inventario.length === 0) return alert("No hay datos para exportar");
            const ws = XLSX.utils.json_to_sheet(inventario);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventario");
            XLSX.writeFile(wb, `Inventario_Madera_${new Date().getTime()}.xlsx`);
        }

        let map = null;
        function initMap() {
            if (!map) {
                map = L.map('map').setView([gps.lat, gps.lng], 18);
                L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                    maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3']
                }).addTo(map);
            }
            inventario.forEach(i => {
                L.circleMarker([i.lat, i.lng], {radius: 8, color: 'white', fillColor: 'green', fillOpacity: 0.8})
                 .addTo(map).bindPopup(`Árbol #${i.id}<br>${i.vol} m³`);
            });
        }

        // Slider Calibración
        document.getElementById('range-calib').oninput = function() {
            document.getElementById('val-calib').innerText = this.value;
        };

        actualizarUI();
    </script>
</body>
</html>
