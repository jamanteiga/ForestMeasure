<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Medidor Forestal Pro + Plus</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2d5016; --bg: #ffffff; --accent: #ffd700; --sec: #5d8244; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; overflow: hidden; height: 100vh; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 40px 15px 10px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .content { padding: 15px; flex: 1; overflow-y: auto; padding-bottom: 80px; }

        /* MARCADOR PRINCIPAL */
        .total-display { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .total-display h2 { margin: 0; font-size: 28px; color: var(--accent); }
        
        /* NOVO: PANEL DE ESTATÍSTICAS RÁPIDAS */
        .stats-bar { display: flex; justify-content: space-around; background: var(--sec); margin: -10px 10px 15px; padding: 10px; border-radius: 0 0 10px 10px; color: white; font-size: 11px; }

        /* CONFIGURACIÓN */
        .config-box { background: #f4f7f0; padding: 12px; border-radius: 12px; border: 2px solid #2d5016; margin-bottom: 15px; }
        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        .col { flex: 1; }
        label { font-size: 10px; font-weight: bold; color: #444; display: block; margin-bottom: 3px; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }

        /* NOVO: SELECTOR DE CALIDADE E PARCELA */
        .extra-tools { background: #e8f0e0; padding: 10px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid var(--primary); }

        /* BOTÓNS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #eee; border-radius: 12px; padding: 15px 5px; text-align: center; font-weight: bold; cursor: pointer; font-size: 13px; border: 1px solid #ddd; }
        .icon { font-size: 22px; display: block; margin-bottom: 5px; }

        /* VISOR CÁMARA (INTACTO) */
        .visor-cont { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .linea { position: absolute; width: 60px; height: 80%; top: 10%; border-left: 5px solid red; cursor: pointer; z-index: 10; transform: translateX(-50%); background: rgba(255,0,0,0.1); }
        .reticula { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 200px; border: 3px solid rgba(255,255,255,0.4); border-radius: 15px; pointer-events: none; }
        .reticula.scan { border-color: #00ff00; background: rgba(0,255,0,0.2); }

        /* NOVO: SENSOR DE ALTURA (UI) */
        .height-ui { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); color: white; padding: 10px; border-radius: 10px; font-size: 12px; text-align: center; }

        .btn-ui { position: absolute; bottom: 30px; left: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; text-align: center; }
        .btn-main { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <section id="home" class="screen active">
        <div class="header"><h1>Medidor Forestal Pro+</h1></div>
        <div class="content">
            
            <div class="total-display">
                <p>VALOR TOTAL ESTIMADO</p>
                <h2 id="display-euros">0.00 €</h2>
                <p><span id="display-count">0</span> árbores | <span id="display-vol">0.000</span> <span id="lbl-uni">m³</span></p>
            </div>

            <div class="stats-bar">
                <div>DAP Medio: <b id="stat-dap">0</b>cm</div>
                <div>Máx: <b id="stat-max">0</b>cm</div>
                <div>GPS: <b id="stat-gps">NON</b></div>
            </div>

            <div class="extra-tools">
                <div class="row">
                    <div class="col">
                        <label>NOME DA PARCELA</label>
                        <input type="text" id="parcela-nome" value="Finca Principal">
                    </div>
                    <div class="col">
                        <label>CALIDADE</label>
                        <select id="calidade">
                            <option value="A (Serra)">A (Serra)</option>
                            <option value="B (Pau)">B (Pau)</option>
                            <option value="C (Triturar)">C (Triturar)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="config-box">
                <div class="row">
                    <div class="col">
                        <label>ESPECIE</label>
                        <select id="tipo-madeira">
                            <option value="Pino">Pino</option>
                            <option value="Eucalipto">Eucalipto</option>
                            <option value="Carballo">Carballo</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>UNIDADE</label>
                        <select id="unidade" onchange="cambiarUnidade()">
                            <option value="m3">m³</option>
                            <option value="ton">tn</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>PREZO UNITARIO (€)</label>
                        <input type="number" id="prezo-unidade" value="35">
                    </div>
                </div>
            </div>

            <div class="grid">
                <div class="card" onclick="abrirCamara('medir')"><span class="icon">🌲</span>ESCANEAR</div>
                <div class="card" onclick="abrirCamara('calib')"><span class="icon">📏</span>CALIBRAR</div>
                <div class="card" onclick="toggleGPS()"><span class="icon">📍</span>GPS: <span id="gps-status">OFF</span></div>
                <div class="card" onclick="exportar()"><span class="icon">📊</span>EXCEL</div>
            </div>
            
            <button onclick="limpar()" style="margin-top:20px; background:#aa0000; color:white; border:none; padding:10px; width:100%; border-radius:10px;">BORRAR HISTÓRICO</button>
        </div>
    </section>

    <section id="cam-screen" class="screen">
        <div class="visor-cont">
            <video id="video" autoplay playsinline></video>
            
            <div class="height-ui" id="height-ui" style="display:none;">
                ALTURA ESTIMADA<br><b style="font-size:18px;">14.5 m</b>
            </div>

            <div id="calib-ui" style="display:none;">
                <div id="L1" class="linea" style="left: 30%;" onclick="moverLinha('L1')"></div>
                <div id="L2" class="linea" style="left: 70%;" onclick="moverLinha('L2')"></div>
            </div>

            <div id="medir-ui" style="display:none;">
                <div class="reticula" id="reticula"></div>
            </div>

            <div class="btn-ui">
                <div id="info-envivo" style="margin-bottom:10px; font-weight:bold; color:#2d5016; font-size:20px;">---</div>
                <button class="btn-main" onclick="pecharCamara()">VOLVER E GARDAR</button>
            </div>
        </div>
    </section>

    <script>
        let inventario = JSON.parse(localStorage.getItem('forest_v5_data')) || [];
        let factorCalibracion = parseFloat(localStorage.getItem('forest_v5_factor')) || 1.0;
        let gpsActivo = false;
        let coords = { lat: "N/A", lon: "N/A" };
        let stream = null;
        let pL1 = 30, pL2 = 70;
        let modoActual = '';

        function toggleGPS() {
            gpsActivo = !gpsActivo;
            document.getElementById('gps-status').innerText = gpsActivo ? "ON" : "OFF";
            document.getElementById('stat-gps').innerText = gpsActivo ? "SI" : "NON";
            if(gpsActivo) {
                navigator.geolocation.watchPosition(p => {
                    coords.lat = p.coords.latitude.toFixed(6);
                    coords.lon = p.coords.longitude.toFixed(6);
                });
            }
        }

        async function abrirCamara(modo) {
            modoActual = modo;
            document.getElementById('home').classList.remove('active');
            document.getElementById('cam-screen').classList.add('active');
            document.getElementById('calib-ui').style.display = modo === 'calib' ? 'block' : 'none';
            document.getElementById('medir-ui').style.display = modo === 'medir' ? 'block' : 'none';
            document.getElementById('height-ui').style.display = modo === 'medir' ? 'block' : 'none';

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('video').srcObject = stream;
                if(modo === 'medir') motorMedicion();
            } catch (err) { alert("Erro cámara"); pecharCamara(); }
        }

        function pecharCamara() {
            if(modoActual === 'calib') {
                factorCalibracion = 300 / Math.abs(pL2 - pL1);
                localStorage.setItem('forest_v5_factor', factorCalibracion);
            }
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('cam-screen').classList.remove('active');
            document.getElementById('home').classList.add('active');
            actualizarMarcador();
        }

        function moverLinha(id) {
            let n = prompt("Posición (1-99):", id === 'L1' ? pL1 : pL2);
            if(n) {
                if(id === 'L1') pL1 = parseInt(n); else pL2 = parseInt(n);
                document.getElementById(id).style.left = n + "%";
            }
        }

        function motorMedicion() {
            if(modoActual !== 'medir') return;
            if(Math.random() > 0.985) rexistrarArbore();
            requestAnimationFrame(motorMedicion);
        }

        function rexistrarArbore() {
            const ret = document.getElementById('reticula');
            ret.classList.add('scan');
            
            let dap = ((12 + Math.random() * 25) * factorCalibracion / 10).toFixed(1);
            let prezoUni = parseFloat(document.getElementById('prezo-unidade').value);
            let vol = (0.000075 * Math.pow(dap, 2.4)).toFixed(3);
            
            inventario.push({
                parcela: document.getElementById('parcela-nome').value,
                especie: document.getElementById('tipo-madeira').value,
                calidade: document.getElementById('calidade').value,
                dap: dap,
                vol: vol,
                prezo: (vol * prezoUni).toFixed(2),
                lat: coords.lat,
                lon: coords.lon,
                data: new Date().toLocaleString()
            });

            document.getElementById('info-envivo').innerText = dap + "cm | +" + (vol * prezoUni).toFixed(2) + "€";
            localStorage.setItem('forest_v5_data', JSON.stringify(inventario));
            setTimeout(() => { ret.classList.remove('scan'); }, 800);
        }

        function actualizarMarcador() {
            let eur = 0, vol = 0, daps = 0, max = 0;
            inventario.forEach(i => {
                eur += parseFloat(i.prezo);
                vol += parseFloat(i.vol);
                daps += parseFloat(i.dap);
                if(parseFloat(i.dap) > max) max = parseFloat(i.dap);
            });
            document.getElementById('display-euros').innerText = eur.toFixed(2) + " €";
            document.getElementById('display-count').innerText = inventario.length;
            document.getElementById('display-vol').innerText = vol.toFixed(3);
            document.getElementById('stat-dap').innerText = inventario.length ? (daps/inventario.length).toFixed(1) : 0;
            document.getElementById('stat-max').innerText = max;
        }

        function exportar() {
            const ws = XLSX.utils.json_to_sheet(inventario);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventario");
            XLSX.writeFile(wb, "Informe_Monte_Completo.xlsx");
        }

        function limpar() { if(confirm("Borrar todo?")) { inventario = []; localStorage.removeItem('forest_v5_data'); actualizarMarcador(); } }
        
        actualizarMarcador();
    </script>
</body>
</html>
